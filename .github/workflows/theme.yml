name: Theme prüfen und veröffentlichen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Theme prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Quellen laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Schema und gespeicherte Einstellungen prüfen
        run: python3 tools/validate_schema.py --self-test .
      - name: Entwicklungsabhängigkeiten installieren
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Suche und Farbauswahl prüfen
        run: npm test
      - name: Offizieller Shopify Theme Check
        uses: Shopify/theme-check-action@58fd69afdfc30110f997ba9e212b302671e00d3b # v2.2.0
        with:
          theme_root: '.'
          version: '4.9.3'
          flags: '--fail-level warning'
      - name: Installationspaket prüfen
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 tools/build_release.py --tag "$RELEASE_TAG"
          else
            python3 tools/build_release.py
          fi

  release:
    name: GitHub Release erstellen
    needs: check
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Geprüfte Quellen laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release-Paket bauen
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/build_release.py --tag "$RELEASE_TAG"
      - name: Version mit Installationspaket veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "dist/upswing-shopify-theme-${release_version}.zip" \
            "dist/upswing-shopify-theme-${release_version}.zip.sha256" \
            "dist/upswing-shopify-theme-${release_version}.manifest.json" \
            --verify-tag \
            --title "Upswing Theme ${release_version}" \
            --notes-file dist/release-notes.md
